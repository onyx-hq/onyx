# `postgres` feature is required for the real Airhouse / Postgres
# destinations (without it airway compiles a stub that errors at run
# time) — note that shape: airway's features gate *runtime stubs*, not
# compilation, so dropping one it needs would pass `cargo check` and fail
# on a live run. Airway's full list is `default = ["duckdb", "cli"]`
# (verified at rev 8cd1213), so naming `duckdb` + `postgres` below is
# exactly the old set minus `cli` — nothing else is silently dropped.
# `duckdb` is named explicitly rather than inherited from
# `default-features`, because airway's defaults also carry `cli`, which
# exists to gate `tracing-subscriber` and the subscriber its binary
# installs. A library host installs its own; inheriting it compiled that
# plus its transitive crates only to throw them away. Airway keeps `cli`
# default-on deliberately — dropping it there would make `cargo build`
# stop emitting the `airway` binary with no error, since cargo skips a
# target whose `required-features` are unmet silently — so the opt-out
# belongs on this side. `duckdb` is still required: the `http_file`
# source arm builds on it.
# Pinned to the 0.1.24 tag (`dc84d7be`). Four changes oxy consumes:
#
#   * #105 `EndpointConfig::contract` — a per-endpoint
#     `Option<SourceContract>` so the ~24 REST-backed connectors can
#     declare one. **Singular, and a field on the endpoint** — not a
#     name-keyed map on `RestApiConfig`. Upstream chose the inline field
#     so a contract rides its endpoint through the `--resources` filter;
#     a side map would not be filtered with it, and every unselected
#     resource would then read as an orphan. The consequence oxy depends
#     on is that an orphan is *unrepresentable* for `rest_api` (the key
#     is always the endpoint's own name), which is why
#     `preview::orphan_verdicts` can still set `not_fixable_here`
#     unconditionally. An undeclared `rest_api` endpoint is now a fixable
#     declaration in the pipeline's own `.airway.yml`, which is why the
#     admin policy preview no longer flags the kind `not_fixable_here`.
#   * #107 a run where EVERY resource failed returns `Err` instead of
#     `Ok` + `completed_with_errors`. Oxy maps that to a failed run, which
#     is what re-surfaces the "Reconnect QuickBooks" affordance on an
#     `invalid_grant`.
#   * #108 QuickBooks cascades the document `Id` into nested child tables
#     (`invoice_id`, `bill_id`, `purchase_order_id`,
#     `inventory_adjustment_id`, `item_id`). **Additive columns only** —
#     nothing renamed. A consumer joining a child to its parent still
#     needs `_aw_parent_id = parent._aw_id` as well; the propagated key
#     alone over-counts across re-ingests, since children load
#     append-only.
#   * #111 `cursor_lag_floor_secs` on `GlobalConfig`, wired through the
#     `airway_deployment_config` tier.
#
# Supersedes 0.1.23 (version-guarded `Merge`/`Replacing` writes,
# per-resource `SourceContract`s, the `ContractPolicy` + `Environment`
# admission checks), 0.1.22, 0.1.21 and 0.1.20 — all still carried.
#
# `tag`, now that upstream pushes them: 0.1.23 shipped only as a
# `release/0.1.23` branch, so that one had to be a `rev` to stay
# immutable. A tag is immutable enough for this and reads better in a
# diff; a *branch* pin would not be, and must never be used here.
#
# 0.1.30 adds `SourceConnector::column_hints`, which is why the ubereats
# source needed this bump: without it a connector cannot declare a column's
# type, and an all-null column does not materialize at all — leaving the
# landed table's shape dependent on which file loaded first.
#
# It also carries the **netsuite** connector, which `source_factory` now has
# an arm for. Two changes arrived at this pin from different directions and
# both are consumed: #2937 for `column_hints`, this one for netsuite.
#
# Note the tag is NOT the `release/0.1.30` branch tip this was briefly
# pinned to (`608c9e5`): the release merged as #127 and picked up the
# netsuite work along the way, so `0.1.30` is a superset, +1514 lines.
# Everything ubereats consumes is byte-identical between the two —
# `ubereats.rs`, `connector/mod.rs`, `source/mod.rs`, `schema/inference.rs`
# and `filesystem.rs` are unchanged, and the `SourceConnector` method list
# is identical.
#
# ---
#
# 0.1.31 (`4423cd3f`) carried two bugs this feature hit head-on:
#
#   * airway#133 — the file sources built their object store with
#     `object_store::parse_url`, which reads NO environment: endpoint, static
#     keys and region were all dropped, and the client went to IMDS instead.
#     Not local-only — the region defaulting to `us-east-1` fails a us-west-2
#     bucket's signature, so the extract could not have worked in dev either.
#   * airway#134 — the Postgres destination filled a `$1`..`$N` template by
#     ascending string replacement, and `$1` is a prefix of `$10`, so every
#     table of ten or more columns was corrupted. Ours has 54.
#
# 0.1.32 adds one netsuite fix (#136) on top. It is not confined to netsuite
# though — it also rewrites `schema/inference.rs`, which ubereats goes
# through: a declared `primary_key` / `merge_key` set is now AUTHORITATIVE,
# clearing a key that is no longer declared, where before it could only add
# one. That only changes behaviour when the declared set NARROWS between
# batches, which is the netsuite `inventory_balance` case. Ubereats declares
# a constant `["_row_uid"]` on every call, so there is nothing to clear and
# the change is inert here — checked rather than assumed, and re-verified end
# to end on this pin.
#
# 0.1.33 is the first bump in a while with NO blast radius outside its own
# source. `git diff --name-only 0.1.32 0.1.33` is `netsuite.rs`, `CHANGELOG.md`,
# `Cargo.toml`, `Cargo.lock` — no shared module, so nothing to reason about for
# ubereats, toast or quickbooks. It carries two netsuite changes:
#
#   * airway#138 — `items` stops being cursored and becomes a full snapshot.
#     A cursor on `lastmodifieddate` only fetches rows that CHANGED inside the
#     window, and items go quiet once they settle, so 43 of BMG's 671 listed
#     items had never landed at all. ~5,300 rows, six page-reads. No backfill
#     or schema reset is needed: `Replace` re-reads the whole table, so the
#     first run on this pin closes the gap by itself.
#   * airway#139 — declares `partition_keys` / `sort_keys` for the first time
#     on this connector: `transaction_lines` partitioned by `location` (11.16M
#     rows over 17 locations, and every FBA query filters on it), sorted by
#     `item`; `transactions` sorted by `trandate`.
#
# #139 is the one with a plumbing dependency on THIS repo rather than airway:
# `boxed.rs` must forward `partition_keys` / `sort_keys`, or the box silently
# substitutes the trait defaults and the declarations never reach
# `SET PARTITIONED BY`. It does (`crates/agentic/airway/src/boxed.rs:87-93`) —
# checked before pinning, because the failure mode is a no-op with no error.
#
# One behavioural note for anyone reading a slow query after this lands:
# `SET PARTITIONED BY` is applied in `migrate_schema_impl`, so it does reach
# the existing `transaction_lines` (which is `Merge` and never dropped), but
# it is lazy — existing Parquet keeps its layout until compaction rewrites it.
# The benefit accrues, it does not switch on.
# Pinned at 0.1.35 (main's bump for keyless children + employee propagation,
# #3000). It carries the 0.1.34 TLS fix (oxy-hq/airway-internal#141) the OLTP
# feature relies on: the eight `tokio_postgres` call sites route through one
# connector, so a pipeline can write to a managed Postgres — Neon, Supabase, RDS
# with `rds.force_ssl` — instead of failing the handshake. (0.1.33 and earlier
# connected `NoTls` and could not.)
airway = { git = "https://github.com/oxy-hq/airway-internal.git", tag = "0.1.42", default-features = false, features = [
  "duckdb",
  "postgres",
] }
airform-loader = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-parser = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-jinja = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-graph = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-compiler = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-analyzer = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-executor = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }

[workspace.package]
version = "0.5.144"
authors = ["oxy engineers"]
description = "Oxy"
documentation = "https://oxygen-hq.com/docs"
edition = "2024"
exclude = []
publish = false
rust-version = "1.97.1"

# MEASURED 2026-08-10, do not re-add: `[profile.dev.build-override] debug = false`
# is a no-op in this workspace. A clean A/B (two `cargo clean` + `cargo build -p
# oxy-app` runs, 8-core darwin) produced byte-identical host-built artifacts — the
# proc-macro dylibs (291,532 KB) and build-script binaries (117,828 KB) matched to
# the kilobyte, and total `target/` differed 0.3%, in the wrong direction. Host
# units already carry no debug info here, so the knob buys nothing and a comment
# claiming a win it does not deliver is worse than its absence.

# NOTE: there is deliberately no `[profile.dev.package]` block here.
# One used to sit at this spot pinning `opt-level = 0` on aws-lc-sys,
# libduckdb-sys, lz4-sys, onig_sys, openssl-sys, ring, aws-sdk-sts,
# datafusion-common, parquet and sqlx-postgres, described as speeding up dev
# builds. It could not: `[profile.dev] opt-level` is already 0 by default, so
# every one of those entries set a value to what it already was. (It also could
# not touch the C/C++ those `*-sys` build scripts compile — that is the `cc`
# crate's business, not a Cargo profile's.) Removed rather than left in place,
# because inert config reads as a tuning lever and stops anyone from looking for
# a real one.
#
# The real per-package lever, if dependency *runtime* ever dominates a test run,
# is the opposite of what was written: `[profile.dev.package."*"] opt-level = 1`
# optimizes dependency code while leaving workspace crates unoptimized. Don't
# add it casually — it forces a from-scratch rebuild of the entire dep graph.

[profile.dev.package."*"]
# Third-party code carries no debug info at all. `[profile.dev] debug =
# "line-tables-only"` below still applies to workspace members, so backtraces keep
# file + line for *our* frames — the ones anyone actually steps through. Frames
# inside dependencies lose line numbers. `-C debuginfo=1` per-command restores it.
#
# MEASURED 2026-08-10 on an 8-core darwin box, clean env, replicated twice. A/B
# against `line-tables-only` (deleting this block IS the before-state, since
# `[profile.dev] debug = "line-tables-only"` already existed):
#
#   warm incremental, one-file edit (median of 5)   56s      -> 30s      (-46%)
#   target/ after a cold build                      16.46 GB -> 10.21 GB (-38%)
#   third-party rlibs                                6.65 GB ->  4.28 GB (-35%)
#   cold `oxy-app` build                                              (-19%)
#
# Warm samples were 31/29/30/32/30 vs 56/57/56/57/55 — spread <=3s in both arms,
# so the effect is not noise. Carry the cold-build *ratio*, not its wall clock:
# absolute times swing with thermal state (one throttled run read 741s -> 911s for
# the same -19%).
#
# THIS IS A LOCAL-DEVELOPER LEVER, NOT A CI ONE. CI already sets
# `CARGO_PROFILE_DEV_DEBUG: "0"` (and `CARGO_PROFILE_DEV_STRIP: "symbols"`) on the
# cargo-check-and-test job — see .github/workflows/ci.yaml — which zeroes debug info
# for the entire graph there, so this block changes nothing on CI. Every number above
# is a win on a developer's machine. Deleting it would not slow CI down by a second,
# which is exactly why the justification has to live here rather than in CI's config.
#
# BEFORE RE-MEASURING THIS, RUN `env | grep CARGO`. Any `CARGO_PROFILE_*` variable
# silently outranks this file for the whole graph — a stray `CARGO_PROFILE_DEV_DEBUG=0`
# strips debug info from both arms and makes the A/B come out flat. That mistake
# published a wrong "no local benefit" conclusion here twice; it is the single
# easiest way to get a false null out of a Cargo profile experiment. Note this is the
# *same* variable CI sets: there it is deliberate, here in an interactive shell it is
# contamination. Reproducing a CI build locally will correctly show no effect.
#
# This is not a per-package override of anything: the `[profile.dev.package]` block
# that used to sit above was deleted as inert (see the note above), so this glob is
# the only per-dependency profile setting in the workspace.
debug = false

[profile.dev]
# NOTE: `split-debuginfo` is deliberately unset — do not "restore" it.
# It was `"shallow"`, which is not a value rustc accepts (`off`, `packed` and
# `unpacked` are the only three). Cargo does not reject the unknown string; it
# silently falls back to the `packed` path, which is the *most* expensive one:
# `dsymutil` runs over every binary and writes a full `.dSYM` bundle beside it.
# On this workspace that meant a dsymutil pass over the ~1.2 GB `oxy` binary and
# over each of the integration-test binaries, and ~10 GB of `.dSYM` in
# `target/debug/deps`. Verified 2026-08-10 with a one-file scratch crate:
# "shallow" and "packed" both emit a .dSYM; "unpacked" and *omitting the key*
# do not.
#
# Omitted rather than pinned to "unpacked" so each platform keeps its own
# default: macOS defaults to `unpacked` (no dsymutil, debug info left in the .o
# files — backtraces are unaffected), and Linux/CI defaults to `off`, which is
# what CI already wants since it sets `CARGO_PROFILE_DEV_DEBUG=0` anyway.
#
# Line tables only (not full DWARF). Measured 2026-07-21 on a free 8-core box:
# a warm one-file `cargo build -p oxy-app` incremental drops 146s -> 73s (-50%),
# because the bin link + dsymutil write far less debug info. Backtraces keep file
# + line numbers; interactive debuggers (lldb) lose local-variable inspection —
# an accepted trade for this build-heavy workspace. `-C debuginfo=2` per-command
# restores full DWARF if you need to step-debug.
debug = "line-tables-only"
