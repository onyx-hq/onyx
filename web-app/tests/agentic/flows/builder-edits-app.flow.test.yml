# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify the builder agent's pipeline can take a free-form Cmd+I prompt
# while the user is viewing a data app, edit the file via its
# `edit_file` tool, auto-accept the suspension, and complete the run
# without surfacing an error.
#
# Architecture note: the builder pipeline does not have a single
# end-of-run "propose_change" suspension — each file-mutating tool
# (`edit_file`, `write_file`, `delete_file`, `manage_directory`)
# individually triggers a `BuilderEvent::FileChangePending` event with
# Accept / Reject buttons. With auto-approve ON those suspensions are
# auto-resolved with "Accept" so the run streams through to completion.
# See `crates/agentic/builder/CLAUDE.md` for the pipeline shape.
#
# Scope is intentionally narrow: this flow tests **only** the builder
# agent editing an existing app, with no org → workspace prelude.
# We run in local mode against `demo_project/insights.app.yml`
# (Oxymart retail-analytics dashboard, store + start_date controls,
# bar/pie charts) — the auth-disabled public port (3000) of
# `oxy start --local --enterprise`.
#
# Preconditions:
#   * $ANTHROPIC_API_KEY in the runner's environment. The backend reads
#     it via `oxy start` so the builder agent has a model to call.
#   * Docker Desktop running. With `backend_mode: local` set below, the
#     runner brings up `oxy start --local --enterprise` itself from
#     `demo_project/` (no manual boot needed).
#
# Caching: `cache_actions: true`. Steady-state PR cost is just the
# judge call (~$0.003) once the two recorded steps are warm.

name: builder agent adds a chart to insights dashboard
target: any

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # Local mode: single-workspace at demo_project/, public port 3000
  # auth-disabled, no orgs, no onboarding wizard. The auth-disabled port
  # plus a fully-populated demo_project means Home doesn't redirect to
  # /onboarding, so we can goto:/apps/<id> directly.
  backend_mode: local
  # ~2 act steps + builder run wait. Pad for builder pipeline iterations.
  max_steps: 30

# `aW5zaWdodHMuYXBwLnltbA==` is base64("insights.app.yml"). Local-mode
# router has no org/workspace prefix — `/apps/<base64>` resolves
# directly to AppPage rendering the file from `demo_project/`.
#
# `restore_demo_file:insights.app.yml` reverts the file to its committed
# content before each run so the builder edit doesn't compound across
# reruns (run 1 adds `weekly_sales_by_store`, run 2 would otherwise add
# a near-duplicate task on top, etc.). Implementation reads from
# `git show HEAD:demo_project/insights.app.yml`, so a dev's staged
# changes elsewhere are unaffected.
setup:
  - "restore_demo_file:insights.app.yml"
  - "goto:/apps/aW5zaWdodHMuYXBwLnltbA=="

cases:
  - name: open builder via Cmd+I, ask for a new chart, wait for completion
    tags: [builder, app, critical]
    steps:
      # Lock the page state. The conditional toggle pattern relies on
      # auto-approve starting OFF, which only holds when the user
      # actually loaded /apps/<id> with an empty localStorage. If the
      # LLM drifted elsewhere this fails loudly.
      - wait_for: "selector:[data-testid=app-page-root]"

      - act: |
          Open the builder dialog and submit a build prompt in one
          atomic sequence. Auto-approve starts OFF in a fresh browser
          context (localStorage empty → autoApprove === false at mount);
          one click flips it ON.

          1. browser_press_key "Meta+i". Dialog appears with
             [data-testid=builder-input-textarea] pre-filled with `@insights `.
          2. browser_click [data-testid=builder-auto-approve-toggle]
             EXACTLY ONCE to flip auto-approve ON. Do NOT verify the
             toggle's data-state attribute first — it starts OFF in a
             clean context.
          3. browser_click [data-testid=builder-input-textarea] to focus.
          4. browser_keyboard_type (NOT browser_type) to APPEND:
               "Add a bar chart at the bottom of the dashboard showing
                total weekly sales by store. Title it 'Sales By Store'
                and filter by the existing date and store controls."
          5. browser_press_key "Enter". URL changes to /threads/<id>.

          Do NOT press Meta+i a second time or click outside the dialog
          — either closes it.
          Do NOT browser_navigate away from /apps/<id>.
          Do NOT browser_snapshot mid-sequence — the snapshot summarizer
          sometimes reports the Radix-portal dialog as missing, which
          makes the LLM re-press Meta+i and close it. Snapshot only
          after the URL change.

      # The builder run streams events into the new thread page; wait
      # for it to finish. Cold builder runs take 30–120 seconds — the
      # solver runs a multi-iteration tool loop (read_file → edit_file
      # → run_app smoke-test → maybe retry), and with auto-approve ON
      # each file-mutation suspension auto-resolves immediately.
      - wait_for: streaming_complete

    expect:
      # The judge runs against a screenshot of the final state — the
      # /threads/<id> page after `streaming_complete` returned. agent-
      # message-container *should* be visible at that point, but the
      # assert is brittle (Radix portals + scroll position) and the judge
      # already covers the substance of the verification, so we skip the
      # assert and rely on the judge alone.
      - judge: |
          The thread page shows the builder run completed successfully:
          (a) the assistant produced a response that references either a
          new task or a new display block being added to insights.app.yml,
          (b) no red error banner is visible, (c) the agent message is
          no longer actively streaming — i.e. there is no Stop button
          beside the chat input and the agent's response text is fully
          rendered. The right-hand app preview pane may still show a
          "Loading app…" spinner while it re-runs the dashboard tasks
          against the freshly-edited file; that spinner is the data app
          re-executing, not the agent stream, and is acceptable. It is
          also acceptable for the response to mention "edit applied" or
          "file updated" — we are NOT asserting the chart actually
          renders on the app page, only that the builder pipeline
          completed without surfacing a fatal error.
