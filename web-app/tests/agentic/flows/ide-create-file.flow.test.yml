# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Create a new, blank file from the IDE Files sidebar and confirm it opens for
# editing — the "New file" affordance itself, not editing one that already
# exists. `ide-save.flow.test.yml` only ever opens `test.sql`, a file that is
# already there (`goto:/ide/files/dGVzdC5zcWw=`) — no committed flow has ever
# clicked "New File". `internal-docs/local-split-fleet-testing.md`'s "Flows
# identified but not yet built" item 5 (P1) names this exact gap: "Creating a
# file is the first action most new users take in the file tree."
#
# WHAT THIS FLOW COVERS, AND WHAT IT DELIBERATELY DOES NOT
# --------------------------------------------------------
# The task this flow was written for asked for create/rename/delete together.
# Only CREATE is exercised here — Rename and Delete are structurally
# unreachable by this test harness today, confirmed by reading the code
# rather than assumed:
#
#   - Rename and Delete exist ONLY behind each file/folder node's
#     ContextMenuTrigger (a right-click / native `contextmenu` event) —
#     FileTreeNode/index.tsx:107-116 (folders) and FileTreeNode/FileNode.tsx:
#     138-147 (files). There is no left-click affordance anywhere in this
#     surface for either action (grepped every `.tsx` under
#     `pages/ide/Files/` for a second Rename/Delete entry point — none
#     exists; confirmed no such action folder exists here either).
#   - The harness's only click primitive, `browser_click`
#     (runner/tool-registry.ts:34-52), calls Playwright's default
#     `.click()` with no button/modifier option — there is no
#     `browser_right_click` tool and no way to pass `{ button: "right" }`
#     through the exposed schema (`inputSchema` at :38-47 takes only
#     `selector`). Radix's `ContextMenu.Trigger` opens strictly on a native
#     `contextmenu` event (or a long-press on touch); a plain `.click()`
#     against the wrapped `SidebarMenuButton` just toggles the folder
#     open/closed (DirNode's own `onClick`, FileTreeNode/index.tsx:119-123)
#     or navigates into the file (FileNode's `<Link>`, FileNode.tsx:165) —
#     it never fires the menu.
#   So Rename and Delete are not just untested — no flow in this suite CAN
#   test them without either (a) a new `browser_right_click` tool, or (b) a
#   keyboard-triggered contextmenu path proven reliable in headless
#   Chromium (Shift+F10 is OS/browser-dependent and not a documented
#   Playwright pattern; not attempted here rather than shipped on a guess).
#   Flagging this as the harness gap worth closing next, not working around
#   it with a shaky keyboard-shortcut guess.
#
# WHY THE "NEW FILE" BUTTON ITSELF NEEDS A CSS SELECTOR, NOT A ROLE ONE
# ----------------------------------------------------------------------
# The toolbar's New File / New Folder / Refresh buttons
# (FilesSidebar/index.tsx:234-266) are icon-only `<Button tooltip="...">`
# with NO `data-testid` and no `aria-label` — `Button`'s `tooltip` prop
# (components/ui/shadcn/button.tsx:34-52) wraps the button in a Radix
# `Tooltip`, which does not set `aria-label`/`aria-labelledby` on the
# trigger, so these three buttons have NO computed accessible name and
# `role=button[name='New File']` will not resolve. They ARE distinguishable
# by their lucide icon's CSS class (`createLucideIcon.mjs`: every icon gets
# class `lucide-<kebab-name>` on top of the base `lucide` class) — FilePlus
# renders `svg.lucide-file-plus`, FolderPlus `svg.lucide-folder-plus`,
# RotateCw `svg.lucide-rotate-cw` — so `button:has(svg.lucide-file-plus)`
# is a reliable, unique Playwright selector even though this button has no
# accessible name. (The Objects/Files sub-view tabs above them DO carry
# real accessible names via their text content — `role=tab[name='Files']`
# — so only the icon-only action row needs this workaround.)
#
# THE NEW-FILE INLINE INPUT ALSO HAS NO TESTID (NewNode.tsx:95-107, a bare
# `<input>` with no id/name/data-testid) and is not auto-focused when
# opened from the root toolbar button (no `ref`/focus effect passed by
# FilesSidebar/index.tsx:315-323, unlike the per-folder context-menu path
# which DOES auto-focus via `onCloseAutoFocus`, FileTreeNode/index.tsx:
# 170-182). `role=textbox` is used below since, at this point in the flow
# (no file open yet, Monaco not mounted), it is the only textbox on the
# page.
#
# FLEET NOTE: file creation is `route_ide("/{pathb64}/new-file",
# post(file::create_file))` (crates/app/src/server/router/workspace.rs:582)
# — IdeOnly, proxied through the serve→ide hop on this deployment exactly
# like every other file-tree write. Not suffixed `-fleet` because, unlike
# `chat-ask-fleet.flow.test.yml`'s analytics endpoint, there is no
# FleetOk/IdeOnly CONTRAST here worth pinning — file writes are IdeOnly in
# every deployment shape, including `--local` (where the single process
# IS the ide). Driven against this session's fleet only because that is the
# backend available here; nothing about the assertions is fleet-specific.
#
# NON-IDEMPOTENT BY DESIGN — READ BEFORE
# RERUNNING. This flow creates a real file, `agentic-test-scratch.md`, at
# the workspace root. Unlike `builder-edits-app`
# (`restore_demo_file:insights.app.yml`) there is no setup command that can
# un-create a file this suite did not ship — `fixtures/reset.ts`'s surface
# is `goto:` / `reset_test_file` / `restore_demo_file:`, none of which
# delete an arbitrary path, and (per the section above) this suite has no
# reachable UI path to Delete either. A second run WILL correctly fail at
# `NewNode`'s existence check ("A file with this name already exists",
# NewNode.tsx:108-112) unless `agentic-test-scratch.md` is removed out of
# band first — the same shape of limitation a cloud-mode flow has with
# Postgres state, solved there by `--clean` on respawn
# (tests/agentic/README.md's cloud-mode section). There is no in-suite
# equivalent for a single workspace's file tree today. This session
# verified the flow with a live run and then removed the created file via
# a direct `DELETE /api/<ws>/files/<pathb64>/delete-file?branch=main` call
# (`FileService.deleteFile`, services/api/files.ts:53-56) — an out-of-band
# admin cleanup, not part of the flow itself, so the shared fleet workspace
# is not left holding this session's scratch file for the next run.
#
# COST: two act steps (switch to Files tab is folded into the first act;
# click New File + type + Enter is the second) plus two structural waits
# and one judge call. No streaming run, no builder run.

name: create a new file from the IDE Files sidebar
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  backend_mode: local
  max_steps: 15

setup:
  - "goto:/ide/files"

cases:
  - name: click New File, name it, and confirm it opens for editing
    tags: [ide, critical]
    steps:
      - act: |
          The Files sidebar defaults to its "Objects" sub-view
          (FilesContext.tsx default). Switch to the raw file tree:
          browser_click role=tab[name='Files'] (the tab next to "Objects",
          just above the file list).

      # `agents` is a real top-level folder in this workspace's fixture
      # (examples/agents/) — waiting for it confirms the FILE tree (not the
      # Objects view, and not a loading spinner) is actually rendered before
      # the next step touches the toolbar above it.
      - wait_for: "selector:text=agents;timeout_ms=15000"

      - act: |
          Create a new file:
          1. browser_click with selector "button:has(svg.lucide-file-plus)"
             — the icon-only "New File" button in the Files sidebar toolbar
             (top-right, left of the New Folder and Refresh icon buttons; it
             has no visible text or accessible name, only a hover tooltip,
             so match it by its FilePlus icon's CSS class as given). A blank
             inline text input appears at the very top of the file list,
             above "agents".
          2. browser_click role=textbox (there is no other textbox on the
             page yet — no file is open, so Monaco has not mounted) to
             focus it.
          3. browser_type into that same textbox: "agentic-test-scratch.md"
          4. browser_press_key "Enter". The file is created and the page
             navigates straight into its editor.

      # data-testid='ide-breadcrumb' — EditorHeader/index.tsx:41. Waiting for
      # it (rather than .monaco-editor alone) ties this specifically to a
      # FILE having opened, not just some editor surface.
      - wait_for: "selector:[data-testid=ide-breadcrumb];timeout_ms=30000"
      - wait_for: "selector:.monaco-editor;timeout_ms=30000"

    expect:
      # Deterministic, $0. The breadcrumb's last segment is the open file's
      # own name (EditorHeader/index.tsx:47-49, filePath.split("/") with the
      # final part as BreadcrumbPage) — this is the proof that navigation
      # landed on the FILE THIS STEP JUST CREATED, not merely "some file".
      - assert: "selector [data-testid=ide-breadcrumb] is visible"
      - assert: 'text "agentic-test-scratch.md" is visible'
      - assert: "selector .monaco-editor is visible"
      # NewNode's own failure surface (NewNode.tsx:75-79) is a Sonner toast
      # with no stable selector and no `text ... is not visible` assert form
      # exists (runner/judge.ts only supports `text "..." is visible`) — so
      # its absence is covered by the judge's fail-condition (a) below
      # instead of a deterministic assert here.

      - judge: |
          The IDE shows an open file editor for a brand-new, EMPTY file
          named "agentic-test-scratch.md" — the breadcrumb/tab area names
          it, and the Monaco editor body below is blank (no pre-existing
          content, no error text, no "file not found").

          Fail if ANY of the following is true:
          (a) an error toast or inline error message is visible (e.g.
              "Failed to create file", "There was a problem creating the
              file", any red/destructive alert);
          (b) the editor shows content other than an empty file (would mean
              the wrong file opened, or stale content leaked in);
          (c) the page is still on a "New Object" typed-file dialog
              (Analytics Agent / Automation / App / Test File / View /
              Topic) rather than a plain new file — that is a DIFFERENT
              affordance (`NewObjectButton`) from the one this flow drives;
          (d) any visible text contains "Workspace directory not found",
              "No such file or directory", "os error", or an absolute
              filesystem path.
