name: CI check

on:
  pull_request:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - trigger-ci-workflow
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  workflow_dispatch:
    inputs:
      agentic_only:
        description: "Skip non-agentic jobs (fmt-web, build-web, smoke, e2e, cargo clippy/nextest) so the agentic-tests matrix runs against just a freshly-built binary. Use this for fast iteration on browser-test selectors."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  # Incremental compilation only helps warm local rebuilds. In CI it adds
  # bookkeeping overhead and bloats `target/incremental`, which the rust-cache
  # action strips before saving anyway — so we pay to produce artifacts that get
  # thrown away and inflate cache size. Force it off (overrides the global
  # `incremental = true` in .cargo/config.toml, which is there for local dev).
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changesets:
    if: |
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || (!startsWith(github.head_ref,
        'release/') && !github.event.pull_request.draft))
    uses: ./.github/workflows/changesets.yaml
    name: Changesets

  fmt-web:
    name: Format web
    needs: [changesets]
    concurrency:
      group: fmt-web-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # `ci-scripts` too: this is the ONLY Biome invocation in CI, so without it a
    # counter-only diff formats nothing — which would leave `.github/scripts/**`
    # in `biome.json` and `mjs` in the lint-staged glob doing nothing on exactly
    # the file they were added for.
    if: |
      inputs.agentic_only != true &&
      (needs.changesets.outputs.web-app == 'true' ||
       needs.changesets.outputs.ci-scripts == 'true')
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # Install + lint-staged on the diff runs in ~2m warm; 15m covers a cold
    # pnpm store with generous headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: 26
          cache: "pnpm"

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run lint-staged
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm lint-staged --diff="origin/${{ github.base_ref }}...origin/${{ github.head_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            pnpm lint-staged --diff="${{ github.event.before }}...${{ github.event.after }}"
          fi

  build-web:
    name: Build web
    needs: [changesets]
    concurrency:
      group: build-web-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: inputs.agentic_only != true && needs.changesets.outputs.web-app == 'true'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # `pnpm build` (turbo) runs in well under 10m; 25m absorbs a cold cache /
    # full TS rebuild while still bounding a hung Vite/tsc process.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: 26
          cache: "pnpm"

      # Cache TypeScript build info for incremental compilation
      # Key on tsconfig only — tsbuildinfo handles incremental source changes internally
      - name: Cache TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            web-app/tsconfig.app.tsbuildinfo
            web-app/tsconfig.node.tsbuildinfo
          key: typescript-${{ runner.os }}-${{ hashFiles('web-app/tsconfig*.json') }}
          restore-keys: |
            typescript-${{ runner.os }}-

      # Cache Vite pre-bundled deps (only invalidates when dependencies change, not source)
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            web-app/node_modules/.vite
            web-app/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml',
            'web-app/vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # Cache Turbo for monorepo builds
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies & Build web-app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Enable Turbo remote caching (optional - configure if using Turbo remote cache)
          # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          # TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          # Install with frozen lockfile for reproducibility
          pnpm install --frozen-lockfile --prefer-offline
          # Build using Turbo for better caching
          pnpm build

  vitest:
    name: Web unit tests (Vitest)
    needs: [changesets]
    concurrency:
      group: vitest-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Own job, off the critical path (nothing `needs:` it). Gated on the web-app
    # changeset like fmt-web/build-web.
    # `ci-counter` too: this job owns the counter's only web-app-side consumer,
    # so a counter-only diff must exercise it — without dragging in the ARM
    # build and the agentic suite that also gate on `web-app`.
    if: |
      inputs.agentic_only != true &&
      (needs.changesets.outputs.web-app == 'true' ||
       needs.changesets.outputs.ci-counter == 'true')
    # Warp arm64, like every other job in this repo that runs tests — the lint
    # and format jobs stay on `ubuntu-slim` because they are not tests.
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # The Vitest unit suite runs in ~1-2m warm; 15m covers a cold pnpm store.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      # `test:unit` is `vitest run` (non-watch). Invoked directly via the pnpm
      # workspace filter — NOT wired as a turbo task (turbo.json is owned outside
      # this change-scope), so it runs standalone.
      # NON-BLOCKING: this suite was never gated before and carries pre-existing
      # failures across areas untouched by this change (billing / database /
      # context-graph / metric-tree). It runs for visibility; drop
      # `continue-on-error` to enforce once a dedicated pass greens the suite.
      - name: Run Vitest unit suite
        continue-on-error: true
        run: pnpm --filter oxy-web run test:unit

      # `src/**/*.test.tsx` is typechecked by no other project — `tsconfig.app.json`
      # excludes it and `tsconfig.node.json` covers only `tests/`. See the header
      # of `web-app/tsconfig.test.json` for why it is not in `references:` yet.
      #
      # A RATCHET, not a pass/fail gate: the project carries a documented backlog
      # of pre-existing errors, so blocking on zero would block every contributor.
      # Blocking on "no more than there were" catches the bug this exists to catch
      # — a test file referencing a field the wire type no longer has — while the
      # backlog drains. Lower TS_TEST_ERROR_BASELINE whenever a pass clears some;
      # at 0, delete this step and add the project to `tsconfig.json`'s references.
      - name: Typecheck unit tests (ratchet)
        env:
          # Matches a real tsc diagnostic's `(line,col): error TSxxxx:`.
          # Requiring a `file` prefix in front of it is what makes a CONFIG
          # failure — `error TS5058`, `error TS18003`, both at column 0 —
          # count zero rather than read as a shrinking backlog.
          TS_DIAG_TAIL: '\([0-9]+,[0-9]+\): error TS[0-9]+:'
          TS_TEST_ERROR_BASELINE: 118
          # 122 test files exist today (the `--showConfig` count this step runs);
          # floor just under, so a real exclusion trips it but adding or
          # deleting a handful of tests does not.
          TS_TESTFILE_FLOOR: 115
        run: |
          # A gate that reports success while checking nothing is the bug this
          # branch started from, and it has three keys. All three are closed.
          #
          # $DIAG requires a `file(line,col):` prefix, which every real
          # diagnostic carries and no CONFIG failure does — `error TS5058: The
          # specified path does not exist` and `error TS18003: No inputs were
          # found` start at column 0 with no file. So a moved tsconfig counts 0
          # and, exiting non-zero, trips the guard below.
          #
          # `--fail-if-no-match`: a filter matching no package prints "No
          # projects matched the filters" and exits ZERO, which the guard cannot
          # see — an exit-0 run with 0 errors is also what a genuinely cleared
          # backlog looks like. The flag makes it the non-zero case instead.
          #
          # `rc=0; … || rc=$?`, not `…; rc=$?`: this workflow runs under
          # `bash -eo pipefail`, so a bare assignment from a failing command
          # aborts the step before the guard reads it. The `|| …` list is what
          # errexit skips.
          DIAG="^[^ ]+$TS_DIAG_TAIL"
          progfiles=$(cd web-app && pnpm exec tsc -p tsconfig.test.json --showConfig \
            | node "$GITHUB_WORKSPACE/.github/scripts/count-test-files.mjs") || progfiles=-1
          case "$progfiles" in (-1) ;; (''|*[!0-9]*) progfiles=-1 ;; esac
          if [ "$progfiles" -lt 0 ]; then
            echo "::error::Could not count the test files in tsconfig.test.json — the error above this line says why. The ratchet cannot run without knowing the program it measures."
            exit 1
          fi
          if [ "$progfiles" -lt "$TS_TESTFILE_FLOOR" ]; then
            echo "::error::tsconfig.test.json resolves only $progfiles test files (floor $TS_TESTFILE_FLOOR). The project was narrowed — the ratchet below would measure a smaller program and read as a drained backlog."
            exit 1
          fi
          rc=0
          out=$(pnpm --fail-if-no-match --filter oxy-web run lint:ts:tests 2>&1) || rc=$?
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -cE "$DIAG" || true)
          if [ "$rc" -ne 0 ] && [ "$count" -eq 0 ]; then
            echo "::error::lint:ts:tests exited $rc but produced no diagnostics — the invocation is broken, not the backlog cleared."
            exit 1
          fi
          echo "typecheck errors in src/**/*.test.*: $count (baseline $TS_TEST_ERROR_BASELINE), over $progfiles test files (floor $TS_TESTFILE_FLOOR)"
          if [ "$count" -gt "$TS_TEST_ERROR_BASELINE" ]; then
            echo "::error::$count typecheck errors, above the baseline of $TS_TEST_ERROR_BASELINE. A test file references something that no longer typechecks."
            exit 1
          fi
          if [ "$count" -lt "$TS_TEST_ERROR_BASELINE" ]; then
            echo "::notice::Backlog is down to $count. Lower TS_TEST_ERROR_BASELINE in ci.yaml to hold the ground."
          fi
          # Gate on the SIZE of the slack, not on any gap: the gap IS the
          # exclusion budget, and a gap of 1 is harmless where a gap of 70 is
          # the failure. An always-on notice trains people to skim past
          # notices, and the three error-baseline ones are self-extinguishing
          # by construction — this one has to earn the same property.
          slack=$(( progfiles - $TS_TESTFILE_FLOOR ))
          allowed=$(( progfiles / 5 ))
          if [ "$allowed" -lt 5 ]; then allowed=5; fi
          if [ "$slack" -gt "$allowed" ]; then
            echo "::notice::tsconfig.test.json resolves $progfiles test files against a floor of $TS_TESTFILE_FLOOR — $slack could be excluded before CI notices. Raise TS_TESTFILE_FLOOR in ci.yaml to hold the ground."
          fi



  sdk-typecheck:
    name: SDK typecheck (ratchet)
    needs: [changesets]
    concurrency:
      group: sdk-typecheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Its own job rather than a step on `vitest`: an SDK-only diff pays for one
    # `pnpm install` and a `tsc`, not the whole web-app unit suite it shares
    # nothing with. Gated on `sdk` OR `ci-counter`, the latter because this job
    # is one of the counter's two consumers.
    if: |
      inputs.agentic_only != true &&
      (needs.changesets.outputs.sdk == 'true' ||
       needs.changesets.outputs.ci-counter == 'true')
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # One tsc over ~60 files; 15m covers a cold pnpm store.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline

      # The SDK's own tests are invisible to every gate it has: `tsconfig.json`
      # excludes `**/*.test.ts`, `tsdown` builds from that same config, vitest
      # transpiles without checking, and no CI workflow but `sdk-publish` runs
      # this package at all. A checked-in fixture stopped satisfying its own
      # interface here and nothing reported it. Same ratchet shape as above.
      - name: Typecheck SDK tests (ratchet)
        env:
          # See the web-app ratchet for what this pattern buys.
          TS_DIAG_TAIL: '\([0-9]+,[0-9]+\): error TS[0-9]+:'
          # TWO baselines, because this project is src + tests in one program
          # (the tests import the sources, so a test-only `include` would pull
          # them in anyway). Pooled, fixing one ambient-types error in src would
          # mask a new fixture drift and the step would stay green on exactly
          # what it exists to catch.
          SDK_TEST_ERROR_BASELINE: 13
          SDK_TESTFILE_ERROR_BASELINE: 6
          # 12 test files today; floor just under. See the web-app ratchet.
          SDK_TESTFILE_FLOOR: 10
        run: |
          # See the web-app ratchet above for $DIAG, --fail-if-no-match and
          # the `|| rc=$?` form.
          DIAG="^[^ ]+$TS_DIAG_TAIL"
          progfiles=$(cd sdk/typescript && pnpm exec tsc -p tsconfig.test.json --showConfig \
            | node "$GITHUB_WORKSPACE/.github/scripts/count-test-files.mjs") || progfiles=-1
          case "$progfiles" in (-1) ;; (''|*[!0-9]*) progfiles=-1 ;; esac
          if [ "$progfiles" -lt 0 ]; then
            echo "::error::Could not count the test files in tsconfig.test.json — the error above this line says why. The ratchet cannot run without knowing the program it measures."
            exit 1
          fi
          if [ "$progfiles" -lt "$SDK_TESTFILE_FLOOR" ]; then
            echo "::error::tsconfig.test.json resolves only $progfiles test files (floor $SDK_TESTFILE_FLOOR). The project was narrowed — the ratchet below would measure a smaller program and read as a drained backlog."
            exit 1
          fi
          rc=0
          out=$(pnpm --fail-if-no-match --filter @oxy-hq/sdk run typecheck:tests 2>&1) || rc=$?
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -cE "$DIAG" || true)
          testcount=$(printf '%s\n' "$out" | grep -cE "^src/[^ ]*\.test\.tsx?$TS_DIAG_TAIL" || true)
          if [ "$rc" -ne 0 ] && [ "$count" -eq 0 ]; then
            echo "::error::typecheck:tests exited $rc but produced no diagnostics — the invocation is broken, not the backlog cleared."
            exit 1
          fi
          echo "sdk typecheck errors: $count total (baseline $SDK_TEST_ERROR_BASELINE), $testcount in test files (baseline $SDK_TESTFILE_ERROR_BASELINE), over $progfiles test files (floor $SDK_TESTFILE_FLOOR)"
          if [ "$testcount" -gt "$SDK_TESTFILE_ERROR_BASELINE" ]; then
            echo "::error::$testcount typecheck errors in SDK test files, above the baseline of $SDK_TESTFILE_ERROR_BASELINE. A fixture no longer satisfies the type it is declared against."
            exit 1
          fi
          if [ "$count" -gt "$SDK_TEST_ERROR_BASELINE" ]; then
            echo "::error::$count SDK typecheck errors, above the baseline of $SDK_TEST_ERROR_BASELINE."
            exit 1
          fi
          if [ "$count" -lt "$SDK_TEST_ERROR_BASELINE" ] || [ "$testcount" -lt "$SDK_TESTFILE_ERROR_BASELINE" ]; then
            echo "::notice::SDK backlog is down to $count total / $testcount in tests. Lower the baselines in ci.yaml to hold the ground."
          fi
          # Gate on the SIZE of the slack, not on any gap: the gap IS the
          # exclusion budget, and a gap of 1 is harmless where a gap of 70 is
          # the failure. An always-on notice trains people to skim past
          # notices, and the three error-baseline ones are self-extinguishing
          # by construction — this one has to earn the same property.
          slack=$(( progfiles - $SDK_TESTFILE_FLOOR ))
          allowed=$(( progfiles / 5 ))
          if [ "$allowed" -lt 5 ]; then allowed=5; fi
          if [ "$slack" -gt "$allowed" ]; then
            echo "::notice::tsconfig.test.json resolves $progfiles test files against a floor of $SDK_TESTFILE_FLOOR — $slack could be excluded before CI notices. Raise SDK_TESTFILE_FLOOR in ci.yaml to hold the ground."
          fi
  sdk:
    name: SDK packages (typecheck, lint, test, build)
    needs: [changesets]
    concurrency:
      group: sdk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: inputs.agentic_only != true && needs.changesets.outputs.sdk == 'true'
    # Warp arm64 like the other jobs that run tests. `sdk/cli`'s suite spawns
    # the built binary, so it needs a real runner rather than ubuntu-slim.
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # ~2m warm; 15m covers a cold pnpm store.
    timeout-minutes: 15
    env:
      # ONE FILTER, read by every step that selects and by the gate that checks
      # them. It was a literal in three `run:` lines and a fourth in
      # `verify-sdk-scripts.mjs`, which could not see the other three — narrow
      # it in one place and the gate would audit a different set than the steps
      # it is about, which is the two-lists failure this job's comments argue
      # against, one level up.
      SDK_FILTER: "./sdk/**"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline

      # FIRST, because it is about the three steps below it. Run last, a PR
      # adding a package without `typecheck` showed a GREEN blocking Typecheck
      # and reddened three steps later under a name about something else — the
      # failure landing away from the step it explains. It needs only `pnpm
      # install`, four steps up.
      #
      # It also DERIVES what it requires from those steps, by reading which
      # scripts they run across `$SDK_FILTER` — so this list and that one
      # cannot drift.
      - name: Verify every sdk package declares the scripts this job runs
        run: node scripts/ci/verify-sdk-scripts.mjs

      # BLOCKING, unlike the web-app Vitest job above. That one carries
      # pre-existing failures and runs for visibility; these steps are green
      # today, and a suite that is allowed to fail is a suite nobody fixes.
      #
      # `sdk/typescript` is the one exception, carved out by name below rather
      # than by making the whole job advisory — an exception you can see is
      # worth more than a green tick that means nothing. That exclusion is
      # deliberately NOT shared into `SDK_FILTER`: promoting the package (the
      # standing instruction on the advisory step) deletes this line and that
      # step together, and a shared variable would leave a third edit behind.
      #
      # ONE LIST, NOT TWO. `pnpm-workspace.yaml` already names every member, so
      # enumerating three of them here was a second list to keep in step — the
      # filter states the rule and names the single exclusion instead. Adding a
      # package is still one edit, to the workspace file, and it then joins all
      # three steps at once. `--fail-if-no-match` because a filter matching
      # nothing is otherwise silent; and a third gap needs a script rather than
      # a flag — `pnpm run` skips a selected project that lacks the script,
      # which is what the step ABOVE checks. Why each of the three, and the
      # measurements: internal-docs/oxy-api-cli.md, "What CI checks about the
      # SDK packages".
      - name: Typecheck
        run: |
          pnpm --filter "$SDK_FILTER" \
               --filter "!./sdk/typescript" \
               --fail-if-no-match \
               --parallel typecheck

      # NOT BLOCKING, and this is the whole reason: `sdk/typescript` imports
      # `@duckdb/duckdb-wasm` without declaring it, and uses `react-dom/server`
      # with no `@types/react-dom`. Both are real pre-existing gaps in a
      # PUBLISHED package, and both are fixed by adding dependencies — a
      # decision with bundle-size and peer-dep consequences that belongs to
      # whoever owns that package, not to whichever PR trips over it first.
      #
      # MOVE IT INTO THE STEP ABOVE THE MOMENT THOSE LAND — and the `run` line
      # annotates EVERY green run until someone does, because nothing else
      # watches that transition. `continue-on-error` means a green run looks
      # identical to a red one in the checks list, and "known red" in this
      # step's name silently becomes false. A nag rather than a one-shot is the
      # point: an annotation on the single run where it first passed is one
      # nobody was looking at that week. The `&&` gates nothing — a failing
      # `tsc` short-circuits it, which is today's behaviour exactly.
      #
      # ITS TWELVE SUITES ARE IN THE CONFIG NOW, though, because a suite the
      # compiler never reads is a suite where a type-level guard reaches
      # nothing — the same argument that put the other three packages' tests in
      # the blocking step. They are in HERE rather than there because this step
      # already cannot fail the build, so including them costs nothing and
      # measures the gap instead of hiding it. Measured AS OF THIS COMMIT: 8
      # diagnostics before, 13 after — a snapshot, which moves the day either
      # dependency lands or a suite is added. Read the codes off the
      # `Typecheck sdk/typescript` step's log — named, because log retention is
      # finite and "this step" only helps a reader already standing here —
      # rather than trusting these two numbers: an earlier version of this
      # paragraph split the five new ones into "4 + 2" (which is six) and named
      # a cause — `@types/node` missing from a `types` array this tsconfig does
      # not have — that the log does not support. Without the suites in scope,
      # promoting this step the day the two dependencies above land would
      # silently not cover them.
      - name: Typecheck sdk/typescript (advisory — known red, see comment)
        continue-on-error: true
        run: |
          pnpm --filter "./sdk/typescript" typecheck \
            && echo "::warning::sdk/typescript now typechecks — promote it into the blocking Typecheck step and drop this one"

      # NAMED FOR WHAT IT COVERS, because `biome.json`'s `files.includes` lists
      # only `sdk/typescript/**` and `sdk/cli/**` — `biome check sdk` never
      # reads create-oxy-app or vite-plugin, so calling this step "Lint" under a
      # job called "SDK packages" would claim more than it does.
      #
      # Adding the other two is a two-line edit to biome.json, but they carry
      # pre-existing format and lint findings, and reformatting two packages
      # this PR has no other reason to touch is exactly what it declined to do
      # for sdk/typescript's typecheck above. Same call, same reason.
      #
      # `scripts/ci` IS A SECOND PATH, not a second `files.includes` entry. A
      # path argument BOUNDS the traversal — `files.includes` filters within
      # what is walked — so adding `scripts/ci/**` to biome.json while this
      # step said `biome check sdk` linted nothing at all. Measured: a
      # deliberately mis-formatted `verify-cli-package.mjs` is invisible to
      # `biome check sdk` and caught by `biome check sdk scripts/ci`.
      - name: Lint (cli + typescript + the CI scripts — see biome.json)
        # Scoped by biome.json itself, so running it at the root is what keeps
        # the CI gate and the editor in step. Warnings do not fail it; errors do.
        run: pnpm exec biome check sdk scripts/ci

      - name: Test
        # `sdk/cli` has a `pretest` that builds, because part of its suite
        # spawns `dist/main.mjs` to pin the exit-code contract — the thing an
        # agent branches on, and the one contract no unit test can check.
        run: pnpm --filter "$SDK_FILTER" --fail-if-no-match test

      - name: Build
        run: pnpm --filter "$SDK_FILTER" --fail-if-no-match build

      - name: Verify the CLI tarball carries its template and skills
        run: node scripts/ci/verify-cli-package.mjs

  templates:
    name: Scaffold templates
    needs: [changesets]
    concurrency:
      group: templates-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # BOTH filters, because this job scaffolds against @oxy-hq/sdk,
    # @oxy-hq/vite-plugin and @oxy-hq/create-oxy-app. `sdk/**` was dropped from
    # the `web-app` filter so an sdk-only PR stops running the web pipeline;
    # without this second condition that same edit would have silently stopped
    # gating the one web job that genuinely depends on sdk/.
    if: |
      inputs.agentic_only != true &&
      (needs.changesets.outputs.web-app == 'true' || needs.changesets.outputs.sdk == 'true')
    # Warp arm64 like the other test jobs: this one does four real pnpm
    # installs, which is the slow part.
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # Four scaffolds x (install + tsc + vite build) is ~4-6m warm; 25m covers a
    # cold pnpm store.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      # The probe installs the templates' `@oxy-hq/*` deps from this checkout,
      # so those packages need their `dist/` first.
      - name: Build the SDK packages the templates consume
        run: >-
          pnpm --filter @oxy-hq/sdk --filter @oxy-hq/vite-plugin
          --filter @oxy-hq/create-oxy-app build
      - name: Scaffold, install and build every template
        run: node scripts/ci/verify-templates.mjs

  cargo-fmt:
    name: Format cargo (rustfmt --check)
    needs: [changesets]
    concurrency:
      group: cargo-fmt-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Own quick job (not folded into the heavy check/test matrix) so a formatting
    # failure gives a fast, isolated signal and never masks the clippy/nextest run.
    if: |
      inputs.agentic_only != true &&
      needs.changesets.outputs.oxy == 'true' &&
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore: release')) &&
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/'))
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # rustfmt --check on the whole workspace is seconds; 10m is pure hang insurance.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prep Rust (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  cargo-check-and-test:
    concurrency:
      group: cargo-check-and-test-${{ matrix.task }}-${{
        github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: [changesets]
    # In agentic_only mode the agentic-tests matrix needs the binary
    # this job produces, so force it to run even if
    # `needs.changesets.outputs.oxy` is false (a no-Rust PR can still
    # iterate on browser tests).
    if: inputs.agentic_only == true || needs.changesets.outputs.oxy == 'true'
    name: Format cargo, check & test (${{ matrix.task }})
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # The 5h CI runaway that motivated these guardrails happened here: with no
    # cap, a hung cargo/nextest process billed the runner until manually
    # cancelled. Warm cache is ~3m (check) / ~14m (test); a cold full
    # workspace compile + nextest tops out around ~40m, so 60m leaves headroom
    # for a worst-case cold build while killing a true hang within the hour.
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      # Fast CI builds: omit debug info entirely (this replaces the old `ci`
      # cargo profile's `debug = false`). Local dev keeps full debug via the
      # default dev profile — this override only applies in CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Restore the old `ci` profile's `strip = true`: shrinks the uploaded
      # `oxy-binary-ci` artifact and cuts link memory. Trade-off: CI panic
      # backtraces lose symbol names; drop this var if you need them while
      # debugging a flaky test.
      CARGO_PROFILE_DEV_STRIP: "symbols"
    strategy:
      fail-fast: true
      matrix:
        task: [check, test]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # A SECOND, throwaway cluster for the OLTP integration suite, and it is
      # not redundant with the one above.
      #
      # That suite creates and drops whole databases and mints cluster-global
      # roles, so it refuses to run against a cluster holding tenants — it
      # cannot share the control-plane service. It also defaults to
      # `postgresql://postgres:postgres@localhost:15433/postgres` when
      # `OXY_OLTP_ADMIN_URL` is unset, and nothing set it here: every test in
      # `crates/oltp/tests/integration/` skipped, silently, and reported as a
      # pass. The confinement checks — the ones standing between a
      # provider-granted `neon_superuser` and a handed-out credential — were
      # among them.
      #
      # Port and credentials match that default exactly, so the suite needs no
      # configuration and cannot drift back into skipping — and
      # `OXY_OLTP_REQUIRE_DB=1` on the test step turns a mismatch into a red
      # build rather than a quiet one.
      #
      # `services:` is job-level and this job's matrix is [check, test], so the
      # clippy task pulls both containers and pays their health-check wait
      # without ever opening a connection. Actions has no per-matrix services;
      # on an alpine image that is seconds, which is why this is a clause here
      # rather than a restructure. `AGENTIC_ONLY=true` also exits before
      # nextest, so both containers are still pulled and waited on in a mode
      # that never opens them, and OXY_OLTP_REQUIRE_DB protects only the
      # full-test path — which is the only `cargo nextest` invocation in this
      # workflow, so that guarantee is total rather than partial.
      oltp-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          # :15433, matching the suite's default DSN — deliberately off
          # `oxy start`'s :15432 so the two clusters never collide locally.
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # The ClickHouse the engine-backed suites write to: agentic-connector's
      # ClickHouse tests and oxy-app's `warehouse_writes_on_engines`. Both fell
      # back to a testcontainer and skipped when none started, and a skip
      # reports as a pass — the same silence as the OLTP suite above, on the one
      # engine where `ctx.warehouse.insert` then broke in production (0.5.140).
      # `OXY_TEST_REQUIRE_CLICKHOUSE=1` on the test step makes absence a
      # failure. `25.8-alpine` is an LTS published for arm64, which the internal
      # runner is.
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Free disk space
        if: matrix.task == 'test' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Fetch-only: this token just lets cargo read private git deps.
          # Scope to read-only contents so a leaked token can't push.
          permission-contents: read
          repositories: |
            airlayer
            airform
            airway-internal
            snowflake-rs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: runner.os == 'Linux'
        with:
          make-default: true

      - name: Prep Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: nextest
      # Private cargo git deps live under github.com/oxy-hq/* (airway,
      # airform, airlayer, snowflake-rs). The default checkout token
      # only auths THIS repo, so a fresh `rev` bump forces an
      # unauthenticated fetch that fails with "revision not found".
      # `git-fetch-with-cli` is on (.cargo/config.toml), so cargo shells
      # out to git, which uses gh as its credential helper — no token
      # baked into a URL rewrite. This mirrors the local flow exactly:
      # `gh auth login` + `gh auth setup-git`, then cargo fetches private
      # deps for free. --with-token stores the app token in gh's config
      # so the helper resolves it on later cargo steps without re-passing
      # it. Must run before any cargo step.
      - name: Authenticate gh for private cargo git deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "$GH_APP_TOKEN" | gh auth login --with-token
          gh auth setup-git
      - name: Prep cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: ${{ matrix.task }}
      # protobuf is required by lance https://github.com/lancedb/lance/issues/3073
      # Use apt instead of arduino/setup-protoc to avoid GitHub release rate limits / outages.
      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # `cargo build` embeds the web-app dist into the oxy binary via
      # `include_dir!` in crates/app/src/cli/commands/serve.rs. The dist
      # path is a committed symlink: `crates/app/dist -> ../../web-app/dist`.
      # If `web-app/dist` is empty when cargo runs, the binary serves 404
      # on `/` — every Playwright/agentic flow then fails because the
      # frontend never loads. Build the web-app first so the symlink
      # resolves to populated content. Only matters for the `test` task
      # (which uploads the binary used by smoke + agentic jobs); `check`
      # is clippy and doesn't read dist content.
      - name: Setup pnpm
        if: matrix.task == 'test'
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
      - name: Setup Node.js
        if: matrix.task == 'test'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Build web-app dist (embedded into oxy binary)
        if: matrix.task == 'test'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          # Bundle only (skip `tsc -b`): the cargo build just needs the `dist/`
          # bytes for the `include_dir!` embed. Typechecking is covered in
          # parallel by the `build-web` job (full `pnpm build`), so running
          # `tsc -b` here too would duplicate the slowest part of the web build
          # on this job's critical path for no added signal.
          #
          # `build-web` is the whole of it, despite what this comment used to
          # say: `lint:ts` is not run by any job here, and for `oxy-web` it was
          # `tsc --noEmit` against a `files: []` solution tsconfig, which
          # type-checks zero files. It is `tsc -b` now, but it is still not
          # wired into CI — `build-web` is the enforcer.
          pnpm --filter oxy-web exec vite build

      - name: Run task
        env:
          OXY_DATABASE_URL: "postgresql://admin:password@localhost:5432/default"
          OXY_BIN: "${{ github.workspace }}/target/debug/oxy"
          AGENTIC_ONLY: ${{ inputs.agentic_only }}
          OXY_TEST_CLICKHOUSE_URL: "http://localhost:18123"
          OXY_TEST_CLICKHOUSE_PASSWORD: "clickhouse"
        run: |
          if [[ "${{ matrix.task }}" == "check" ]]; then
            if [[ "$AGENTIC_ONLY" == "true" ]]; then
              echo "agentic_only mode: skipping clippy"
              exit 0
            fi
            # Dropped `--fix`: in CI the rewrites are never committed, so it was
            # pure wasted analysis+rewrite work. Matches the documented command
            # in CLAUDE.md. Kept advisory (no `-- -D warnings`): the workspace
            # tree is not yet warning-clean (pre-existing large_enum_variant /
            # type_complexity / should_implement_trait lints), and `check` runs
            # fail-fast, so enforcing now would block every PR. Flip to
            # `-- -D warnings` in a dedicated PR after a warning-cleanup pass.
            # `--all-targets`, so EXAMPLES and benches compile here.
            #
            # Without it neither this nor `cargo build` below builds an example,
            # and a signature change that missed one shipped: `ensure_writer`'s
            # claimant became `Option<Uuid>`, three call sites were updated, and
            # `examples/seed_org.rs` — the demo seeder the README points at —
            # was left as a plain E0308 that CI could not see. The first person
            # to hit it would have been someone setting up the demo.
            cargo clippy --workspace --all-targets
            # Gate the feature-off build: the custom-app-functions (V8) feature is
            # compiled out by the `cf`/`bf`/`rf` aliases in .cargo/config.toml (`cf` is
            # this exact command), and an ungated `use` of a gated symbol only breaks
            # for whoever runs them — which is how the seam-trait regression this guards
            # against reached main. `clippy` (not `check`) so the workspace-member
            # fingerprints from the line above are reused; the check pass runs first, so
            # an E0433 fails it identically.
            cargo clippy --no-default-features -p oxy-app
          elif [[ "${{ matrix.task }}" == "test" ]]; then
            touch examples/bigquery-sample.key
            echo $BIGQUERY_SAMPLE_KEY > examples/bigquery-sample.key

            cargo build

            if [[ "$AGENTIC_ONLY" == "true" ]]; then
              echo "agentic_only mode: skipping migrate, nextest, gen-config-schema"
              exit 0
            fi

            ./target/debug/oxy migrate

            # Run tests (no coverage instrumentation)
            #
            # OXY_OLTP_REQUIRE_DB turns "no OLTP cluster" from a skip into a
            # failure. That suite skipped for this whole PR and reported green;
            # the `oltp-postgres` service above is what makes it run, and this
            # is what makes a future mismatch between the two loud instead of
            # silent. OXY_TEST_REQUIRE_CLICKHOUSE does the same for the
            # `clickhouse` service.
            OXY_OLTP_REQUIRE_DB=1 OXY_TEST_REQUIRE_CLICKHOUSE=1 \
              cargo nextest run --workspace --no-fail-fast

            ./target/debug/oxy gen-config-schema --check
          fi

      - name: Upload oxy binary artifact
        if: matrix.task == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oxy-binary-ci
          path: target/debug/oxy
          retention-days: 1

  smoke-test-enterprise:
    name: Smoke test (oxy start --enterprise)
    needs: [changesets, cargo-check-and-test]
    concurrency:
      group:
        smoke-test-enterprise-${{ github.event.pull_request.number || github.ref
        }}
      cancel-in-progress: true
    if: false # temporarily disabled
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      OXY_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gacts/install-hurl@ab6d0234456944b022ef7d1f594845af9561357d # v1

      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary

      - name: Start oxy
        working-directory: examples
        run: |
          oxy start --enterprise --clean &
          echo "OXY_PID=$!" >> $GITHUB_ENV
          # Wait for server (max 10 min)
          for i in {1..120}; do
            curl -sf --max-time 10 http://localhost:3000/api/health > /dev/null && break
            [ $i -eq 120 ] && { docker ps -a; docker logs oxy-postgres 2>&1 | tail -50; exit 1; }
            sleep 5
          done

      - name: Verify containers
        run: |
          for c in oxy-postgres; do
            docker ps --format "{{.Names}}" | grep -q "^${c}$" || { echo "::error::$c not running"; exit 1; }
          done

      - name: Smoke test - CLI
        working-directory: examples
        run: |
          oxy status
          oxy sync -o
          oxy build
          oxy validate
          oxy run data_fruit/example_food_calories.sql

      - name: Smoke test - HTTP (Hurl)
        run: |
          set -o pipefail
          echo '## Smoke Test Results' >> $GITHUB_STEP_SUMMARY
          hurl --test tests/smoke/smoke.hurl 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Test restart (data persistence)
        working-directory: examples
        run: |
          kill -TERM $OXY_PID 2>/dev/null || true
          for i in {1..30}; do kill -0 $OXY_PID 2>/dev/null || break; sleep 1; done
          sleep 2
          docker volume ls | grep -q oxy || { echo "::error::Volumes not persisted"; exit 1; }
          oxy start --enterprise &
          echo "OXY_PID=$!" >> $GITHUB_ENV
          for i in {1..60}; do
            curl -sf --max-time 10 http://localhost:3000/api/health > /dev/null && break
            [ $i -eq 60 ] && { docker ps -a; exit 1; }
            sleep 5
          done

      - name: Verify restart
        run: |
          for c in oxy-postgres; do
            docker ps --format "{{.Names}}" | grep -q "^${c}$" || { echo "::error::$c not running after restart"; exit 1; }
          done
          set -o pipefail
          hurl --test tests/smoke/smoke.hurl 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          kill -TERM $OXY_PID 2>/dev/null || true; sleep 3
          docker rm -f oxy-postgres 2>/dev/null || true

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [changesets, cargo-check-and-test]
    # 💰 COST SAVING: Only run on approved PRs, pushes to oxy-hq/oxygen main, or manual trigger
    if: false # temporarily disabled
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # Consistency tests + Playwright (the run step is itself capped at 20m).
    # 45m bounds the whole job, including backend boot, if a step wedges.
    timeout-minutes: 45
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      OXY_STATE_DIR: ${{ github.workspace }}/examples
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary

      - name: Set up web-app test environment
        uses: ./.github/actions/setup-web-app-test-env

      # Cache Turbo for monorepo builds
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Setup BigQuery credentials if needed
      - name: Setup BigQuery credentials
        if: env.BIGQUERY_SAMPLE_KEY
        run: |
          touch examples/bigquery-sample.key
          echo "$BIGQUERY_SAMPLE_KEY" > examples/bigquery-sample.key

      # Run consistency tests using pre-built binary
      - name: Run consistency tests
        working-directory: demo_project
        run: |
          echo "Running consistency tests for default.agent.yml..."
          oxy sync -o
          oxy build
          oxy test default.agent.yml \
            --format json \
            --min-accuracy 0.8 \
            --threshold-mode average \
            | tee consistency-test-results.json

          echo "Consistency tests completed successfully!"

      - name: Upload consistency test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: consistency-test-results
          path: demo_project/consistency-test-results.json
          retention-days: 1

      - name: Show consistency test summary
        if: always()
        run: |
          if [ -f demo_project/consistency-test-results.json ]; then
            echo "=== Consistency Test Results ==="
            echo ""
            cat demo_project/consistency-test-results.json
            echo ""
            echo "Full results available in artifacts: consistency-test-results"
          else
            echo "No consistency test results file found"
          fi

      # Start backend server in background
      - name: Start Oxy backend server
        working-directory: examples
        run: |
          # Using pre-built binary - no compilation needed!
          nohup oxy serve > ../oxy-server.log 2>&1 &
          echo $! > /tmp/oxy-server.pid
          echo "Backend server started with PID: $(cat /tmp/oxy-server.pid)"

      # Wait for backend to be ready
      - name: Wait for backend server
        id: wait-backend
        run: |
          echo "Waiting for backend server to be ready..."
          timeout 10 bash -c 'until curl -k -s http://localhost:3000/api/health > /dev/null 2>&1; do echo "Waiting for health endpoint..."; sleep 2; done'
          echo "Backend health endpoint is responding!"

          # Give the backend additional time to scan and load apps from the examples directory
          echo "Waiting for backend to initialize apps..."
          sleep 10

          echo "Backend server should now be fully ready!"

      - name: Show backend server logs if wait failed
        if: steps.wait-backend.outcome == 'failure'
        run: |
          echo "=== Backend Server Logs (from wait failure) ==="
          if [ -f oxy-server.log ]; then
            tail -n 200 oxy-server.log || true
          else
            echo "No server logs found at oxy-server.log"
            ls -la || true
          fi

      # Run E2E tests
      - name: Run Playwright tests
        id: run-playwright
        timeout-minutes: 20
        env:
          PLAYWRIGHT_WORKERS: 2
        run: |
          cd web-app
          pnpm test:e2e

      # Upload test results and traces
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: web-app/playwright-report/
          retention-days: 1

      - name: Upload test results with traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-results
          path: web-app/test-results/
          retention-days: 1

      - name: Show trace instructions
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📹 Test traces, screenshots, and videos have been captured!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "To view the test traces:"
          echo "  1. Download the 'playwright-results' artifact from this workflow run"
          echo "  2. Extract the zip file"
          echo "  3. Run: npx playwright show-trace path/to/trace.zip"
          echo ""
          echo "The trace viewer will open in your browser with:"
          echo "  • Full test execution timeline"
          echo "  • Screenshots at each step"
          echo "  • Network requests/responses"
          echo "  • Console logs"
          echo "  • DOM snapshots"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Cleanup
      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/oxy-server.pid ]; then
            kill $(cat /tmp/oxy-server.pid) || true
            echo "Backend server stopped"
          fi

      - name: Show server logs
        if: failure()
        run: |
          echo "=== Backend Server Logs ==="
          if [ -f oxy-server.log ]; then
            tail -n 200 oxy-server.log
          else
            echo "No server logs found at oxy-server.log"
          fi

          echo ""
          echo "=== Checking if server process is still running ==="
          if [ -f /tmp/oxy-server.pid ]; then
            ps -p $(cat /tmp/oxy-server.pid) || echo "Server process not running"
          fi

      # Send Slack notification on push failure to oxy main
      - name: Find Slack user
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        id: find-slack-user
        uses: scribd/find-slack-user-action@74b39f55855f7ccb59a0901b495e589c9b0f5031 # v1
        continue-on-error: true
        with:
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          email: ${{ github.event.head_commit.author.email }}

      - name: Prepare Slack notification message
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        id: prepare-slack
        run: |
          GITHUB_USER="${{ github.event.head_commit.author.username || github.actor }}"
          AUTHOR_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          SLACK_MEMBER_ID="${{ steps.find-slack-user.outputs.member-id }}"

          echo "GitHub user: $GITHUB_USER"
          echo "Slack member ID: ${SLACK_MEMBER_ID:-not found}"

          if [ -n "$SLACK_MEMBER_ID" ]; then
            echo "✓ Found Slack user for $GITHUB_USER"
            AUTHOR_TEXT="*Author:*\n<@${SLACK_MEMBER_ID}> (${AUTHOR_NAME})"
            MENTION_TEXT="<@${SLACK_MEMBER_ID}> - E2E tests failed on your commit"
          else
            echo "✗ No Slack user found for $GITHUB_USER"
            AUTHOR_TEXT="*Author:*\n${AUTHOR_NAME} (@${GITHUB_USER})"
            MENTION_TEXT=""
          fi

          # Export for next step
          echo "author_text<<EOF" >> $GITHUB_OUTPUT
          echo "$AUTHOR_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "mention_text<<EOF" >> $GITHUB_OUTPUT
          echo "$MENTION_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "eng-events-e2e",
              "text": "🚨 E2E Tests Failed on oxy Main Branch - ${{ steps.prepare-slack.outputs.mention_text || github.event.head_commit.author.name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 E2E Tests Failed on oxy Main Branch"
                  }
                },
                ${{ steps.prepare-slack.outputs.mention_text && format('{{ "type": "section", "text": {{ "type": "mrkdwn", "text": "{0}" }} }},', steps.prepare-slack.outputs.mention_text) || '' }}
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\noxy-hq/oxygen"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\nmain"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ steps.prepare-slack.outputs.author_text }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "${{ github.event.head_commit.url }}"
                    }
                  ]
                }
              ]
            }

  # The matrix, services, boot logic, and healing PR comment live in
  # `.github/workflows/agentic-tests.yaml`. That file is also runnable
  # standalone via workflow_dispatch — see its `on:` block for the
  # required inputs.
  agentic-tests:
    name: Agentic browser tests
    needs: [changesets, cargo-check-and-test]
    if: |
      github.repository == 'oxy-hq/oxygen-internal' && (
        inputs.agentic_only == true ||
        needs.changesets.outputs.web-app == 'true' ||
        needs.changesets.outputs.oxy == 'true'
      ) && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        github.event_name == 'push'
      )
    uses: ./.github/workflows/agentic-tests.yaml
    secrets: inherit
