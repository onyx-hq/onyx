[package]
name = "oxy-api-onboarding"
version.workspace = true
authors.workspace = true
# NOTE: oxy-app does not depend on this crate, but its route-catalog build
# script watches this tree, so editing it still triggers an oxy-app rebuild.
# See crates/app/build_route_catalog.rs (DOC_DIRS / SOURCE_DIRS).
description = "Onboarding HTTP surface (workspace create/demo/import, readiness checks, warehouse uploads) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The only oxy-app dependency: the shared middlewares this surface reuses
# (workspace_context readiness/lazy-compile helpers + the OrgAdmin role guard).
# oxy-app never depends back on this crate. default-features off so a
# `--no-default-features` build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState (the router state type)
oxy = { workspace = true }
oxy-auth = { workspace = true }
oxy-shared = { workspace = true }
oxy-project = { workspace = true }
oxy-git = { workspace = true }
oxy-llm = { workspace = true }               # validate_provider_key (test-llm-key)
entity = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
