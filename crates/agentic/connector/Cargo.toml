[package]
name = "agentic-connector"
description = "Database connector trait, configuration, and backend implementations"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# Optional Arrow zero-copy extension. Enables `AsArrowConnector` and the
# `DatabaseConnector::as_arrow()` method. Backends that natively produce
# Arrow (DuckDB, Snowflake) implement the extension under this feature.
# Row-based backends never need it.
arrow = ["dep:arrow"]
# `SqlTransaction` and `DatabaseConnector::begin_transaction`. Split out because
# the trait signature names `serde_json::Value`, and `serde_json` is optional
# here (see the comment on `estimate_value_bytes`) — leaving the module ungated
# breaks any dependent that enables no connector backend, e.g. agentic-analytics.
# A future backend that overrides `begin_transaction` must add `transactions` to
# its own feature list — `postgres` is the only feature implying it today, and
# forgetting it yields a confusing "override with no trait method" error.
transactions = ["dep:serde_json"]

duckdb = ["dep:duckdb", "dep:slugify"]
# `dep:chrono` — for decoding DATE / TIMESTAMP / TIMESTAMPTZ into owned
# Rust types inside `execute_query_full`.
# `dep:serde_json` — for decoding JSON / JSONB columns.
# `dep:uuid` — for UUID columns on the `ctx.tx` path (a uuid primary key is the
# common shape for an OLTP table, so `INSERT … RETURNING id` needs it).
# `dep:tokio-postgres-rustls` + `dep:rustls` + `dep:webpki-roots` — TLS. Not
# optional-within-the-feature: every managed Postgres (Neon, Supabase, RDS with
# `rds.force_ssl`) refuses a plaintext session, so a `postgres` connector
# without them can only ever reach a local cluster.
postgres = [
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:chrono",
    "dep:serde_json",
    "dep:uuid",
    "transactions",
]

clickhouse = ["dep:reqwest", "dep:serde_json", "dep:serde"]
# MySQL via sqlx-mysql. `chrono` + `serde_json` decode DATE / DATETIME /
# JSON columns into owned Rust types inside `execute_query_full`.
mysql = [
    "dep:sqlx",
    "sqlx/mysql",
    "sqlx/chrono",
    "sqlx/json",
    "sqlx/runtime-tokio",
    "sqlx/tls-rustls",
    "dep:chrono",
    "dep:serde_json",
]
# Snowflake's driver decodes Arrow internally, so turning on `snowflake`
# transitively forces the `arrow` extension on.
snowflake = ["dep:snowflake-api", "dep:serde_json", "arrow", "arrow/json"]
# BigQuery pulls in `base64` for BYTES decoding and `serde_json` for
# RECORD / STRUCT / JSON / ARRAY cell passthrough.
bigquery = ["dep:gcp-bigquery-client", "dep:base64", "dep:serde_json"]
# DOMO: REST-API-backed. `reqwest` + `serde` + `serde_json` are the only
# runtime deps — no DB driver, no CREATE TEMP TABLE.
domo = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
agentic-core = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }

# Arrow (feature-gated via `arrow`)
arrow = { workspace = true, features = ["ipc"], optional = true }
# Non-optional: `guard_row_stream` (always-compiled in `connector.rs`) and the
# Postgres `query_raw` streaming path both depend on `futures`.
futures = { workspace = true }

# DuckDB
duckdb = { workspace = true, optional = true }
slugify = { workspace = true, optional = true }

# Postgres
# `with-chrono-0_4` + `with-serde_json-1` let `execute_query_full` decode
# DATE / TIMESTAMP / JSON / JSONB columns into owned Rust types.
tokio-postgres = { workspace = true, features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
], optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
# `ring` named explicitly: it is a rustls DEFAULT feature, but this crate's
# subgraph also pulls rustls through `sqlx/tls-rustls`, and feature unification
# there can leave the provider configured out — which fails as
# "cannot find `ring` in `crypto`" only when this crate is built alone.
rustls = { workspace = true, optional = true, features = ["ring"] }
webpki-roots = { workspace = true, optional = true }

# ClickHouse (HTTP API)
reqwest = { workspace = true, features = [
    "rustls",
    "json",
    "query",
], optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

# Snowflake
snowflake-api = { workspace = true, optional = true }

# BigQuery
gcp-bigquery-client = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# MySQL
sqlx = { workspace = true, optional = true }

[dev-dependencies]
duckdb = { workspace = true }
# Capturing subscriber for the query-span test in `duckdb`.
tracing-subscriber = { workspace = true, features = ["registry"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# testcontainers for integration tests that spin up a real Postgres / MySQL
# / ClickHouse server. DOMO tests use `wiremock` since there is no public
# container image.
testcontainers = { workspace = true, features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { workspace = true, features = [
    "postgres",
    "clickhouse",
    "mysql",
] }
wiremock = { workspace = true }
