[package]
name = "agentic-runtime"
description = "Generic execution runtime for agentic pipeline runs — entities, migrations, and CRUD"
version = "0.5.31"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
agentic-core = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
croner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# tokio-postgres is used by `router::postgres` for its dedicated
# `LISTEN oxy_task_enqueued` connection. SeaORM doesn't expose the
# notification stream — we need the raw `tokio_postgres::Client` to
# call `notifications()` on the connection. Production code path only;
# tests that use `NoopTaskRouter` don't depend on this client at all.
tokio-postgres = { workspace = true }
# rustls-backed TLS connector for the LISTEN connection. RDS requires TLS;
# the same provider sqlx uses elsewhere keeps the trust-store story
# uniform. `webpki-roots` supplies Mozilla CA bundle so we don't depend
# on the OS trust store.
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Capturing subscriber for the span-shape tests in `orchestrator::worker`.
tracing-subscriber = { workspace = true, features = ["registry"] }
agentic-analytics = { path = "../analytics" }
agentic-builder = { path = "../builder" }
testcontainers = { workspace = true, features = ["blocking", "reusable-containers"] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
# `migrate_shared_test_db` — central-then-runtime migration ordering shared
# with agentic-pipeline / agentic-airway fixtures. See oxy-test-utils::migration.
oxy-test-utils = { workspace = true }
