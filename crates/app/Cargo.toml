[package]
name = "oxy-app"
version.workspace = true
authors.workspace = true
description = "Oxy Application - CLI and HTTP server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# The `oxy` binary lives in the `oxy-server` crate (the composition root that
# mounts the API surfaces); oxy-app is a library only.
#
# For the optional dev-dynamic-linking fast loop, oxy-app is NOT itself a dylib
# (that would build a ~1.4 GB dylib on every release/CI build). Instead the thin
# `oxy-app-dylib` crate re-exports it as a dylib, pulled in only by oxy-server's
# `dev-dynamic` feature. See `just dev-backend-dyn`.

[features]
default = ["custom-app-functions"]
# V8-isolate runtime for Oxy Functions. On by default so `oxy serve --local`
# runs the real runtime (see design doc §11.8); a build profile that wants to
# skip V8 entirely can use `--no-default-features`.
custom-app-functions = ["deno_core", "deno_error"]

[dependencies]
deno_core = { workspace = true, optional = true }
deno_error = { workspace = true, optional = true }
handlebars = { workspace = true }
df-interchange = { workspace = true, features = ["arrow_56", "arrow_57"] }
libc = { workspace = true }

# Core functionality
oxy = { workspace = true }
oxy-git = { workspace = true }
oxy-llm = { workspace = true }
oxy-observability = { workspace = true }
oxy-shared = { workspace = true }
oxy-telemetry = { workspace = true }
oxy-workspace-fs = { workspace = true }
oxy-airform = { workspace = true }
agentic-airway = { workspace = true }
agentic-analytics = { workspace = true }
agentic-builder = { workspace = true }
agentic-connector = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "snowflake",
    "bigquery",
    "mysql",
    "domo",
] }
airhouse = { workspace = true, features = ["connector", "rest"] }
oxy-oltp = { workspace = true }
agentic-core = { workspace = true }
agentic-http = { workspace = true }
agentic-llm = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
agentic-semantic = { workspace = true }
agentic-automation = { workspace = true }
oxy-airlayer-compat = { workspace = true }
oxy-auth = { workspace = true }
oxy-app-core = { workspace = true }
oxy-authz = { workspace = true }
oxy-server-authz = { workspace = true }
oxy-billing = { workspace = true }
oxy-cameras = { workspace = true }
oxy-compile = { workspace = true }
oxy-project = { workspace = true }
oxy-semantic = { workspace = true }
oxy-metric-monitoring = { workspace = true }
entity = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
dashmap = { workspace = true }
async-openai = { workspace = true, features = [
    "byot",
    "chat-completion-types",
    "response-types",
    "_api",
    "responses",
    "chat-completion",
    "embedding-types",
    "embedding",
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Validation
garde = { workspace = true, features = ["full"] }
schemars = { workspace = true, features = ["derive", "impl_json_schema"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging/Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
] }
log = { workspace = true }

# Web framework
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "compression-br", "compression-gzip"] }
# Server-side resolution of custom-app client-error stacks. Maps stay in the
# build store and are never served to a browser — see custom_apps_sourcemap.
sourcemap = "9"
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

# HTTP client. `stream` enables reqwest::Body::wrap_stream for the ide_proxy
# reverse-proxy (forwards IdeOnly request bodies without buffering).
reqwest = { workspace = true, features = ["stream", "form", "query", "json"] }

# Code utilities
enum_dispatch = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "env"] }
colored = { workspace = true }
indicatif = { workspace = true }
headless_chrome = { workspace = true }

# Database
sea-orm = { workspace = true }
clickhouse = { workspace = true, features = ["rustls-tls"] }

# Machine learning (for traces analytics)
linfa = { workspace = true }
linfa-reduction = { workspace = true }
ndarray = { workspace = true, features = ["rayon"] }

# Data processing
arrow = { workspace = true, features = ["json"] }
parquet = { workspace = true }
duckdb = { workspace = true }
oxy-simulation = { path = "../simulation" }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tempfile = { workspace = true }
minijinja = { workspace = true, features = ["loader"] }
once_cell = { workspace = true }
scopeguard = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
# Only for the AsyncMessage variant the chat listener matches on; the
# connection itself is minted by agentic-runtime, which owns the TLS and IAM
# decisions a listener must not make for itself.
tokio-postgres = { workspace = true }
tokio-stream = { workspace = true }
include_dir = { workspace = true }
tower-serve-static = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
constant_time_eq = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
# Composes the MIME for app email so it is OUR artifact and can be asserted
# byte-exact offline — see emails/mime.rs.
lettre = { workspace = true }
# customer-apps publish pipeline: tarball pack/unpack + bundle LRU cache
tar = { workspace = true }
flate2 = { workspace = true }
# Build-time brotli for bundle assets, so the serve path never re-compresses
# an immutable content-hashed file — see server/api/custom_apps_precompress.rs.
# rayon fans that compression across the bundle: it is the one-shot cost that
# `oxy publish` makes an engineer wait on.
brotli = { workspace = true }
rayon = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
governor = { workspace = true }
base64 = { workspace = true, features = ["std"] }
regex = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
glob = { workspace = true }
home = { workspace = true }
human-panic = { workspace = true }
humantime = { workspace = true }
indoc = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
lazy_static = { workspace = true }
email_address = { workspace = true }
serde_urlencoded = { workspace = true }
self_update = { workspace = true }
slugify = { workspace = true }
syntect = { workspace = true }
tabled = { workspace = true }
terminal-light = { workspace = true }
terminal_size = { workspace = true }
secrecy = { workspace = true }
serde_with = { workspace = true }
strip-ansi-escapes = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
semver = { workspace = true }
backoff = { workspace = true, features = ["tokio"] }
rustc_version_runtime = { workspace = true }
sentry = { workspace = true }
omni = { workspace = true }
oxy-looker = { workspace = true }
oxy-slack-client = { workspace = true }

# Database migration
migration = { workspace = true }

# MCP
rmcp = { workspace = true, features = [
    "server",
    "transport-sse-server",
    "transport-io",
] }

# Other dependencies from core that might be needed
dotenv = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
serial_test = { workspace = true }
oxy-test-utils = { workspace = true }
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
testcontainers = { workspace = true, features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { workspace = true, features = ["postgres", "clickhouse"] }
# The OLTP provisioner tests connect *as the minted writer role* to prove the
# DSN it hands back actually works and lands writes in the right schema — the
# one thing asserting on the generated SQL cannot show.
# Captures the SES request without a network call or an emulator, so the
# attachment wire format is asserted against the real SDK serializer.
aws-smithy-http-client = { workspace = true, features = ["test-util"] }
aws-credential-types = { workspace = true, features = ["test-util"] }
