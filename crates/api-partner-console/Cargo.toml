[package]
name = "oxy-api-partner-console"
version.workspace = true
authors.workspace = true
# NOTE: oxy-app does not depend on this crate, but its route-catalog build
# script watches this tree, so editing it still triggers an oxy-app rebuild.
# See crates/app/build_route_catalog.rs (DOC_DIRS / SOURCE_DIRS).
description = "Partner self-service HTTP surface (/api/partners) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Cross-surface handler calls that still live in oxy-app (organizations invite
# helpers, the base-url util, org_teams service/dto, custom-apps access-cache +
# consent, and admin apps/workspace-health readers). This is the only oxy-app
# dependency, and oxy-app never depends back on this crate (the whole point of the
# extraction). default-features off (this surface doesn't use custom-app-functions/
# V8): a `--no-default-features` build of oxy-server keeps dropping V8, and this
# crate never forces it back on via resolver-v2 unification.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }     # AppState (router state) + the audit reader
oxy-server-authz = { workspace = true } # partner_authz, partner_allows, assume_liveness, enforce_for/Action/Resource
oxy-authz = { workspace = true }        # Action/Resource rings (app_mgmt access checks)
oxy = { workspace = true }              # database client
oxy-auth = { workspace = true }         # AuthenticatedUserExtractor
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl (route_roles)
entity = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }            # tokio::spawn (fire-and-forget invite email) + #[tokio::test]
tracing = { workspace = true }
